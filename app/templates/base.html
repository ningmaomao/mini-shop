<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Mini Shop{% endblock %}</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f7fb;color:#1f2937}nav{display:flex;justify-content:space-between;padding:16px 28px;background:#111827;color:white}nav a{color:white;text-decoration:none;margin-left:16px}.wrap{max-width:1100px;margin:28px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:white;border-radius:14px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,.06)}button{padding:10px 14px;border:0;border-radius:8px;background:#111827;color:white;cursor:pointer}input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 14px;border:1px solid #d1d5db;border-radius:8px}.muted{color:#6b7280}</style></head><body><nav><strong>Mini Shop</strong><div>{% if current_user.is_authenticated %}<a href="/">商城</a>{% if current_user.role == 'admin' %}<a href="/admin">商家后台</a>{% endif %}<form method="post" action="/logout" style="display:inline"><button type="submit">退出</button></form>{% endif %}</div></nav><main class="wrap">{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="card">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
